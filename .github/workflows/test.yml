name: Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t sushant564/docker_kub -f Dockerfile.dev .

      - name: Run tests
        run: docker run -e CI=true sushant564/docker_kub npm run test -- --coverage